spring.application.name=backend
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clocostdb}
spring.jpa.hibernate.ddl-auto=update
app.seed-data.enabled=${APP_SEED_DATA_ENABLED:false}
app.anomaly.cron=${ANOMALY_CRON:0 0 6 * * *}
aws.region=${AWS_REGION:us-east-1}
gcp.billing.endpoint=${GCP_BILLING_ENDPOINT:https://bigquery.googleapis.com}
gcp.billing.project=${GCP_BILLING_PROJECT:}
gcp.billing.dataset=${GCP_BILLING_DATASET:}
gcp.billing.table=${GCP_BILLING_TABLE:}
gcp.billing.access-token=${GCP_BILLING_ACCESS_TOKEN:}
azure.cost-management.endpoint=${AZURE_COST_MANAGEMENT_ENDPOINT:https://management.azure.com}
azure.cost-management.access-token=${AZURE_COST_MANAGEMENT_ACCESS_TOKEN:}
