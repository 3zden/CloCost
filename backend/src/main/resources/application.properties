spring.application.name=backend
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clocostdb}
spring.jpa.hibernate.ddl-auto=update
app.seed-data.enabled=${APP_SEED_DATA_ENABLED:false}
app.anomaly.cron=${ANOMALY_CRON:0 0 6 * * *}
aws.region=${AWS_REGION:us-east-1}
gcp.billing.endpoint=${GCP_BILLING_ENDPOINT:https://bigquery.googleapis.com}
gcp.billing.project=${GCP_BILLING_PROJECT:}
gcp.billing.dataset=${GCP_BILLING_DATASET:}
gcp.billing.table=${GCP_BILLING_TABLE:}
gcp.billing.access-token=${GCP_BILLING_ACCESS_TOKEN:}
azure.cost-management.endpoint=${AZURE_COST_MANAGEMENT_ENDPOINT:https://management.azure.com}
azure.cost-management.access-token=${AZURE_COST_MANAGEMENT_ACCESS_TOKEN:}
# Auth (see AUTH.md)
app.auth.jwt-secret=${APP_JWT_SECRET:}
app.auth.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.auth.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:14d}
app.auth.cookie-secure=${APP_COOKIE_SECURE:true}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Behind nginx: build OAuth redirect URIs from X-Forwarded-* (https, public host). Only safe when the proxy is the sole way in.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
