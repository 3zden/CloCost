[project]
name = "clocost"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JOEOFFME", email = "youssefdihako@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka==2.5.3",
    "fastapi==0.115.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "uvicorn[standard]==0.32.0",
]

[project.scripts]
clocost = "clocost:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
